<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LoomGrid 组件展示 · 精密仪器面板</title>
<link rel="stylesheet" href="theme/tokens.css">
<link rel="stylesheet" href="components/base.css">
<link rel="stylesheet" href="components/curve-viewer.css">
<link rel="stylesheet" href="components/data-table.css">
<link rel="stylesheet" href="components/toast.css">
<link rel="stylesheet" href="components/progress.css">
<link rel="stylesheet" href="components/capacity-card.css">
<link rel="stylesheet" href="components/dropzone.css">
<link rel="stylesheet" href="components/period-editor.css">
<style>
/* 展示页自身的排版，不属于组件库 */
body { padding: 0 0 var(--sp-6); }
.showcase-head {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-strong);
}
.showcase-head h1 { font-size: var(--fs-lg); font-weight: 500; margin: 0; }
.showcase-head .meta { font-size: var(--fs-xs); color: var(--text-muted); }
.showcase-body { padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-6); }

.demo-block { display: flex; flex-direction: column; gap: var(--sp-3); }
.demo-block__title {
  display: flex; align-items: baseline; gap: var(--sp-3);
  font-size: var(--fs-xl); font-weight: 500;
  padding-bottom: var(--sp-2);
  border-bottom: 1px solid var(--border-strong);
}
.demo-block__title span { font-size: var(--fs-xs); color: var(--text-muted); font-weight: 400; }
.demo-block__desc { font-size: var(--fs-sm); color: var(--text-muted); max-width: 78ch; }

.demo-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
@media (max-width: 1100px) { .demo-pair { grid-template-columns: 1fr; } }

.demo-pane {
  background: var(--bg-canvas);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-2);
  padding: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.demo-pane__label {
  font-size: var(--fs-xs); color: var(--text-muted);
  font-family: var(--font-num);
}
.demo-states { display: flex; flex-direction: column; gap: var(--sp-3); }
.demo-state__name {
  font-size: var(--fs-xs); color: var(--text-faint);
  margin-bottom: var(--sp-1);
}
.demo-state__name b { color: var(--text-muted); font-weight: 500; }
.demo-table-h { height: 260px; }
</style>
</head>
<body>

<div class="showcase-head">
  <h1>组件展示</h1>
  <span class="meta">精密仪器面板 · 阶段 3</span>
  <span class="spacer"></span>
  <span class="meta" id="token-count"></span>
</div>

<div class="showcase-body" id="root"></div>

<script src="components/curve-viewer.js"></script>
<script>
/* ── 造数据 ─────────────────────────────── */
const N = 96;
const TIMES = Array.from({length: N}, (_, i) => {
  const h = Math.floor(i * 15 / 60), m = (i * 15) % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
});
function profile(scale) {
  return Array.from({length: N}, (_, i) => {
    const h = i * 24 / N;
    const v = 420 + 520*Math.exp(-((h-9.5)**2)/2) + 460*Math.exp(-((h-19.5)**2)/2);
    return Math.round(v * (scale || 1));
  });
}
const MAIN = profile(1);
const AVG = profile(0.88).map(v => Math.round(v * 0.97));
const STATS = [
  { label: '峰值', value: Math.max(...MAIN) + ' kW', priority: 'high' },
  { label: '均值', value: Math.round(MAIN.reduce((a,b)=>a+b,0)/N) + ' kW', priority: 'high' },
  { label: '容量线', value: '500 kW', priority: 'high' },
];
// 注：天数 / 点数不进 stats —— 它们在标题里已经写过（「31 天 · 96 点」），
// 同一份信息不写两遍。规模属于标题，读数属于 stats。
function curveData() {
  return {
    title: 'A-01 · 2026-01 · 31 天 · 96 点',
    unit: 'kW',
    times: TIMES,
    series: [
      { name: '日曲线', data: MAIN, kind: 'line' },
      { name: '平均负荷', data: AVG, kind: 'avg' },
      { name: '容量线 500', value: 500, kind: 'ref' },
    ],
    yMax: 1200, yStep: 200,
    stats: STATS,
    foot: '刻度 0–1200 kW · 200 一档 · 悬停出准线与读数',
    errorTitle: '该分组无法绘制',
    errorDesc: '时刻列中有 12 个值无法识别（如 25:00），清洗后重试',
    emptyDesc: '当前筛选条件下没有可用日期',
  };
}

/* ── 造表格数据 ─────────────────────────── */
const ROWS = [
  ['A栋负荷2026.xlsx','A-01','2026-01',31,96,'312.4','1048.2','宽表','ok','就绪',true],
  ['A栋负荷2026.xlsx','A-01','2026-02',28,96,'298.7','1012.5','宽表','ok','就绪',true],
  ['B&C楼<综合>.xlsx','B-07','2026-01',31,96,'88.1','642.9','转置','warn','需确认',true],
  ['光伏倒送_2026Q1.csv','PV-02','2026-01',31,96,'-186.3','421.0','长表','ok','就绪',false],
  ['老厂区示数表.xls','C-03','2026-01',31,96,'204.0','886.4','示数','err','解析失败',false],
  ['D区冷库.xlsx','D-11','2026-01',31,96,'512.8','1204.6','宽表','ok','就绪',true],
  ['E厂注塑线.xlsx','E-05','2026-01',31,96,'426.7','972.1','宽表','ok','就绪',true],
  ['F仓储中心.xlsx','F-02','2026-01',31,96,'96.3','288.5','宽表','ok','就绪',false],
];
function tableHTML(opts) {
  opts = opts || {};
  const state = opts.state || 'default';
  const rows = (state === 'default' || state === 'disabled') ? ROWS : [];
  const body = rows.map((r, i) => {
    const [f,t,m,d,tp,mn,mx,ft,st,stt,sel] = r;
    const disabled = st === 'err';
    return '<tr data-selected="' + (sel && state !== 'disabled') + '"' +
      (disabled ? ' data-disabled="true"' : '') + '>' +
      '<td><span class="chk" data-checked="' + (sel && state !== 'disabled') + '"' +
      (disabled ? ' data-disabled="true"' : '') + '></span></td>' +
      '<td data-primary="true">' + f + '</td>' +
      '<td data-type="num">' + t + '</td>' +
      '<td data-type="num">' + m + '</td>' +
      '<td data-align="right" data-type="num">' + d + '</td>' +
      '<td data-align="right" data-type="num">' + tp + '</td>' +
      '<td data-align="right" data-type="num">' + mn + '</td>' +
      '<td data-align="right" data-type="num">' + mx + '</td>' +
      '<td>' + ft + '</td>' +
      '<td><span class="badge badge--' + st + '">' + stt + '</span></td>' +
      '</tr>';
  }).join('');

  const selCount = rows.filter(r => r[10]).length;
  return '<div class="data-table" data-state="' + state + '">' +
    '<div class="data-table__bar">' +
      '<button class="btn btn--ghost">全选</button>' +
      '<button class="btn btn--ghost">反选</button>' +
      '<span class="spacer"></span>' +
      '<span class="data-table__count">已选 ' + selCount + ' / ' + rows.length + '</span>' +
    '</div>' +
    '<div class="data-table__scroll"><table>' +
    '<colgroup>' +
      '<col data-w="narrow"><col data-w="flex"><col data-w="num"><col data-w="num">' +
      '<col data-w="num"><col data-w="num"><col data-w="num"><col data-w="num">' +
      '<col data-w="num"><col data-w="num">' +
    '</colgroup>' +
    '<thead><tr>' +
      '<th></th><th>源文件</th><th>表号</th><th>月份</th>' +
      '<th data-align="right">天数</th><th data-align="right">时刻点</th>' +
      '<th data-align="right">最小负荷</th><th data-align="right">最大负荷</th>' +
      '<th>表型</th><th>状态</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<div class="data-table__state data-table__state--empty">没有文件。拖入 .xlsx / .csv 开始</div>' +
    '<div class="data-table__state data-table__state--loading"><span class="data-table__dots"></span> 正在扫描 12 个文件…</div>' +
    '<div class="data-table__state data-table__state--error">扫描失败：无法读取「老厂区示数表.xls」</div>' +
    '</div>';
}

/* ── 组装展示页 ─────────────────────────── */
const STATES = [
  ['default', '默认'],
  ['loading', '加载'],
  ['error', '错误'],
  ['empty', '空数据'],
  ['disabled', '禁用'],
];

function blockCurve() {
  const panes = ['dark','light'].map(theme => {
    const items = STATES.map(([st, name]) =>
      '<div class="demo-state">' +
        '<div class="demo-state__name"><b>' + name + '</b> · state=' + st + '</div>' +
        '<div class="curve-viewer" data-state="' + st + '" data-cv="' + theme + '-' + st + '"></div>' +
      '</div>').join('');
    return '<div class="demo-pane" data-theme="' + theme + '">' +
      '<div class="demo-pane__label">' + theme + '</div>' +
      '<div class="demo-states">' + items + '</div></div>';
  }).join('');
  return '<section class="demo-block">' +
    '<div class="demo-block__title">曲线查看器 <span>V3 中间 · 替代 PreviewDialog 的绘图区</span></div>' +
    '<p class="demo-block__desc">核心画面。判据是「能读数」：刻度必须有、数值等宽、峰值与时刻直接标在图上。悬停出准线与读数气泡；加载与错误态保留坐标框架，让人知道这里本来有图。' +
    '<br>迷你展示用宽扁比例（820:120），不是把标准画面压扁——组件接受「我的画面是宽扁的」这个事实。刻度质量与曲线形态请看下一块的真实尺寸。</p>' +
    '<div class="demo-pair">' + panes + '</div></section>';
}

function blockCurveReal() {
  const panes = ['dark','light'].map(theme =>
    '<div class="demo-pane" data-theme="' + theme + '">' +
      '<div class="demo-pane__label">' + theme + ' · 真实尺寸 820×500</div>' +
      '<div class="curve-viewer" id="cv-real-' + theme + '"></div>' +
    '</div>').join('');
  return '<section class="demo-block">' +
    '<div class="demo-block__title">曲线查看器 · 真实尺寸 <span>小图看不出刻度质量</span></div>' +
    '<p class="demo-block__desc">V3 里曲线区约 820×500。这个尺寸下要看三件事：七档刻度会不会挤、曲线形态能不能看出双峰与谷、峰值标注会不会遮住曲线。</p>' +
    '<div class="demo-pair">' + panes + '</div></section>';
}

function blockTable() {
  const panes = ['dark','light'].map(theme => {
    const items = STATES.map(([st, name]) =>
      '<div class="demo-state">' +
        '<div class="demo-state__name"><b>' + name + '</b> · state=' + st + '</div>' +
        '<div class="demo-table-h">' + tableHTML({state: st}) + '</div>' +
      '</div>').join('');
    return '<div class="demo-pane" data-theme="' + theme + '">' +
      '<div class="demo-pane__label">' + theme + '</div>' +
      '<div class="demo-states">' + items + '</div></div>';
  }).join('');
  return '<section class="demo-block">' +
    '<div class="demo-block__title">数据表格 <span>V1 主表 / V5 清单</span></div>' +
    '<p class="demo-block__desc">用得最多。表头吸顶、无斑马纹、数字右对齐等宽。选中给三重信号（底色 10% + 左竖线 + 次列提亮），因为只靠一条 2px 线在宽表里会被扫视漏掉。失败行不可选，颜色降级但仍可读。</p>' +
    '<div class="demo-pair">' + panes + '</div></section>';
}

function blockToast() {
  const panes = ['dark','light'].map(theme => {
    const items = [
      ['success', '已复制路径', 'D:\\输出\\2026-01'],
      ['info', '配置已保存', '设置 → 扫描并发 4'],
      ['warn', '部分图表失败', '3 张未能生成，详见报告'],
      ['error', '导出目录不可写', '请检查权限或换一个目录'],
    ].map(([kind, title, desc]) =>
      '<div class="demo-state"><div class="demo-state__name"><b>' + kind + '</b></div>' +
      '<div class="toast toast--' + kind + '" style="position:static;max-width:none">' +
        '<div class="toast__body"><div class="toast__title">' + title + '</div>' +
        '<div class="toast__desc">' + desc + '</div></div>' +
        '<button class="toast__close" aria-label="关闭">✕</button>' +
      '</div></div>').join('') +
      '<div class="demo-state"><div class="demo-state__name"><b>带进度</b>（后台任务）</div>' +
      '<div class="toast toast--info" style="position:static;max-width:none">' +
        '<div class="toast__body"><div class="toast__title">正在生成图表</div>' +
        '<div class="toast__desc">7 / 12 张</div>' +
        '<div class="toast__meter"><i style="width:58%"></i></div></div>' +
      '</div></div>';
    return '<div class="demo-pane" data-theme="' + theme + '"><div class="demo-pane__label">' +
      theme + '</div><div class="demo-states">' + items + '</div></div>';
  }).join('');
  return '<section class="demo-block">' +
    '<div class="demo-block__title">Toast <span>全局 · 不打断的信息</span></div>' +
    '<p class="demo-block__desc">用于「已复制」「已保存」这类无需回应的反馈，3 秒自走。需用户回应才用对话框——Fusion 里 141 次 QMessageBox 大部分本该是 Toast。</p>' +
    '<div class="demo-pair">' + panes + '</div></section>';
}

function blockProgress() {
  const stages = [['parse','解析','done'],['scan','扫描','done'],['preload','预加载','active'],['generate','生成图表','pending']];
  const stageItems = stages.map(([k,n,s]) =>
    '<li class="progress__stage" data-state="' + s + '"><div class="progress__bar"><i></i></div>' +
    '<div class="progress__label">' + n + '</div></li>').join('');
  const errStages = stages.map(([k,n,s],i) =>
    '<li class="progress__stage" data-state="' + (i<2?'done':i===2?'error':'pending') + '">' +
    '<div class="progress__bar"><i></i></div><div class="progress__label">' + n + '</div></li>').join('');

  const panes = ['dark','light'].map(theme =>
    '<div class="demo-pane" data-theme="' + theme + '"><div class="demo-pane__label">' + theme + '</div>' +
    '<div class="demo-states">' +
      '<div class="demo-state"><div class="demo-state__name"><b>四阶段</b>（进行中）</div>' +
        '<div class="progress"><div class="progress__head"><span class="progress__title">处理 12 个分组</span>' +
        '<span class="progress__count">7 / 12</span></div>' +
        '<ul class="progress__stages">' + stageItems + '</ul></div></div>' +
      '<div class="demo-state"><div class="demo-state__name"><b>四阶段</b>（某阶段出错）</div>' +
        '<div class="progress"><div class="progress__head"><span class="progress__title">处理 12 个分组</span>' +
        '<span class="progress__count">失败</span></div>' +
        '<ul class="progress__stages">' + errStages + '</ul></div></div>' +
      '<div class="demo-state"><div class="demo-state__name"><b>单任务条</b></div>' +
        '<div class="progress-bar"><div class="progress-bar__row"><span>生成 A-01_2026-01</span>' +
        '<span class="progress-bar__value">58%</span></div>' +
        '<div class="progress-bar__track"><i style="width:58%"></i></div></div></div>' +
      '<div class="demo-state"><div class="demo-state__name"><b>不确定进度</b></div>' +
        '<div class="progress-bar" data-indeterminate="true"><div class="progress-bar__row">' +
        '<span>正在扫描文件…</span></div><div class="progress-bar__track"><i></i></div></div></div>' +
    '</div></div>').join('');

  return '<section class="demo-block">' +
    '<div class="demo-block__title">进度指示 <span>V1 扫描 / 出图、V5 导出</span></div>' +
    '<p class="demo-block__desc">两种形态：四阶段条给「有明确阶段」的流程（对应 ProcessingThread 的四段），单任务条给不知道步数的任务。阶段名必须显示——用户要知道卡在哪一步，不只是转圈。</p>' +
    '<div class="demo-pair">' + panes + '</div></section>';
}

function blockCapacity() {
  const panes = ['dark','light'].map(theme =>
    '<div class="demo-pane" data-theme="' + theme + '"><div class="demo-pane__label">' + theme + '</div>' +
    '<div class="demo-states">' +
      '<div class="demo-state"><div class="demo-state__name"><b>两张并列</b>（不同量纲，不可互换）</div>' +
      '<div class="capacity-row">' +
        '<div class="capacity-card" data-emphasis="true" data-dimension="kWh">' +
          '<div class="capacity-card__label">建议容量</div>' +
          '<div class="capacity-card__value">216.22<span class="capacity-card__unit">kWh</span></div>' +
          '<div class="capacity-card__compare"><span>当前</span><span class="capacity-card__from">120.00</span>' +
          '<span class="capacity-card__delta">+96.22</span></div>' +
          '<div class="capacity-card__basis">口径：最小可行容量 · DOD 95%</div>' +
        '</div>' +
        '<div class="capacity-card" data-dimension="kWh/天">' +
          '<div class="capacity-card__label">日吞吐量</div>' +
          '<div class="capacity-card__value">1855.12<span class="capacity-card__unit">kWh/天</span></div>' +
          '<div class="capacity-card__compare"><span>瓶颈在</span>' +
          '<span class="capacity-card__delta">放电侧</span></div>' +
          '<div class="capacity-card__basis">与左侧容量不可比较：一个是装多大，一个是一天搬多少</div>' +
        '</div>' +
      '</div></div>' +
      '<div class="demo-state"><div class="demo-state__name"><b>无数据</b></div>' +
      '<div class="capacity-row"><div class="capacity-card" data-state="empty" data-dimension="kWh">' +
        '<div class="capacity-card__label">建议容量</div>' +
        '<div class="capacity-card__value">—<span class="capacity-card__unit">kWh</span></div>' +
        '<div class="capacity-card__basis">先设置容量线才能测算</div></div></div></div>' +
    '</div></div>').join('');
  return '<section class="demo-block">' +
    '<div class="demo-block__title">容量卡片 <span>V4 测算结果</span></div>' +
    '<p class="demo-block__desc">数值最大、单位跟在后面不抢位置。关键：<b>容量（kWh）与日吞吐量（kWh/天）两张卡片并列但不可比较</b>，量纲写进卡片标签（data-dimension），不靠文档提醒。</p>' +
    '<div class="demo-pair">' + panes + '</div></section>';
}

function blockDropzone() {
  const mk = (state) => {
    const titles = { idle: '拖入负荷数据文件', hover: '松开即添加', reject: '不支持这类文件', compact: '已添加 5 个文件' };
    const descs = {
      idle: '支持宽表、长表、转置表与示数表，自动识别列',
      hover: '会先扫描列名与表型，再让你确认映射',
      reject: '只接受 .xlsx / .xlsm / .xls / .csv / .xlsb',
      compact: ''
    };
    return '<div class="dropzone" data-state="' + state + '">' +
      '<div class="dropzone__title">' + titles[state] + '</div>' +
      (descs[state] ? '<div class="dropzone__desc">' + descs[state] + '</div>' : '') +
      (state === 'reject' ? '<div class="dropzone__reject-reason">拖入的是「说明文档.pdf」</div>' : '') +
      (state === 'idle' || state === 'hover' ? '<div class="dropzone__formats">.xlsx · .xlsm · .xls · .csv · .xlsb</div>' : '') +
      (state === 'idle' ? '<div class="dropzone__actions"><button class="btn btn--primary">选择文件</button>' +
        '<span class="faint" style="font-size:var(--fs-xs)">或整窗拖入</span></div>' : '') +
      '</div>';
  };
  const panes = ['dark','light'].map(theme =>
    '<div class="demo-pane" data-theme="' + theme + '"><div class="demo-pane__label">' + theme + '</div>' +
    '<div class="demo-states">' +
    [['idle','空闲（V1 空状态）'],['hover','拖入悬停'],['reject','拒绝'],['compact','有文件（收起）']]
      .map(([st,nm]) => '<div class="demo-state"><div class="demo-state__name"><b>' + nm + '</b></div>' +
        mk(st) + '</div>').join('') +
    '</div></div>').join('');
  return '<section class="demo-block">' +
    '<div class="demo-block__title">文件拖放区 <span>V1 工作台空状态</span></div>' +
    '<p class="demo-block__desc">新用户打开程序看到的第一个东西。四态必须各自可辨：空闲 / 拖入悬停 / <b>拒绝</b> / 有文件收起。拒绝不是「什么都不发生」，要说清为什么拒（扩展名 / 体积 / 加密），否则用户以为程序没反应。</p>' +
    '<div class="demo-pair">' + panes + '</div></section>';
}

function blockPeriod() {
  const bars = (list) => list.map(([type, from, to, label, extra]) => {
    const l = from / 24 * 100, w = (to - from) / 24 * 100;
    return '<div class="period-bar" data-type="' + type + '" style="left:' + l + '%;width:' + w + '%"' +
      (extra || '') + '>' + (label || '') +
      '<span class="period-bar__handle" data-side="start"></span>' +
      '<span class="period-bar__handle" data-side="end"></span></div>';
  }).join('');
  const axis = [0,6,12,18,24].map(h =>
    '<span class="period-editor__tick" style="left:' + (h/24*100) + '%"' +
    (h===0?' data-edge="start"':'') + (h===24?' data-edge="end"':'') + '>' + h + ':00</span>').join('');

  const normal = bars([
    ['charge', 0, 8, '充电1'], ['discharge', 8, 11, '放电1'],
    ['charge', 11, 14, '充电2'], ['discharge', 14, 20, '放电2'],
    ['flat', 20, 24, '平']
  ]);
  const conflict = bars([
    ['charge', 0, 9, '充电1'], ['discharge', 8, 11, '放电1', ' data-conflict="true"'],
    ['charge', 11, 14, '充电2'], ['discharge', 14, 20, '放电2']
  ]);
  const selected = bars([
    ['charge', 0, 8, '充电1', ' data-selected="true"'], ['discharge', 8, 11, '放电1'],
    ['charge', 11, 14, '充电2'], ['discharge', 14, 20, '放电2']
  ]);

  const block = (label, inner, foot) =>
    '<div class="demo-state"><div class="demo-state__name"><b>' + label + '</b></div>' +
    '<div class="period-editor"><div class="period-editor__axis">' + axis + '</div>' +
    '<div class="period-editor__track"><div class="period-editor__grid"></div>' + inner + '</div>' +
    foot + '</div></div>';

  const legend = '<div class="period-editor__foot">' +
    '<span class="period-editor__legend"><i class="period-editor__swatch" data-type="charge"></i>充电</span>' +
    '<span class="period-editor__legend"><i class="period-editor__swatch" data-type="discharge"></i>放电</span>' +
    '<span class="period-editor__legend"><i class="period-editor__swatch" data-type="flat"></i>平段</span>' +
    '<span class="period-editor__sum">共 24.0 h</span></div>';
  const legendErr = '<div class="period-editor__foot">' +
    '<span class="period-editor__error">时段重叠：0-9 与 8-11</span>' +
    '<span class="period-editor__sum">共 25.0 h</span></div>';

  const panes = ['dark','light'].map(theme =>
    '<div class="demo-pane" data-theme="' + theme + '"><div class="demo-pane__label">' + theme + '</div>' +
    '<div class="demo-states">' +
    block('标准四段', normal, legend) +
    block('选中充电1', selected, legend) +
    block('时段重叠', conflict, legendErr) +
    '</div></div>').join('');

  return '<section class="demo-block">' +
    '<div class="demo-block__title">时段配置器 <span>V3 右侧策略区</span></div>' +
    '<p class="demo-block__desc">把一天切成充/放/平段。这是整个界面里最独特的一块 —— 没有通用 UI 库有这个东西。判据：一眼分出充放平、边界可拖且拖动时显示精确时刻、<b>重叠立刻可见</b>（业务上不允许，_valid_periods 会拒）。重叠用红色斜纹而不是整块变红，保留时段类型本身的信息。</p>' +
    '<div class="demo-pair">' + panes + '</div></section>';
}

document.getElementById('root').innerHTML = blockCurve() + blockCurveReal() + blockTable() + blockToast() + blockProgress() + blockCapacity() + blockDropzone() + blockPeriod();

/* 迷你块：宽扁比例（820:120），不是把标准画面压扁 */
document.querySelectorAll('[data-cv]').forEach(host => {
  const state = host.dataset.state;
  CurveViewer.render(host, curveData(), { aspect: 820 / 120 });
  CurveViewer.setState(host, state);
});

/* 真实尺寸块：标准比例 */
['dark','light'].forEach(theme => {
  CurveViewer.render(document.getElementById('cv-real-' + theme), curveData());
});

/* 令牌统计（页面自证） */
const cs = getComputedStyle(document.documentElement);
const fsCount = ['2xs','xs','sm','md','lg','xl','2xl'].length;
const spCount = ['1','2','3','4','5','6'].length;
document.getElementById('token-count').textContent =
  '字号 ' + fsCount + ' 档 · 间距 ' + spCount + ' 档 · 圆角 2 档 · 动效 2 档';
</script>
</body>
</html>
