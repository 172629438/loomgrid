<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LoomGrid demo</title>
<style>
  @font-face { font-family: 'Mono'; src: local('JetBrains Mono'), local('Consolas'), local('Cascadia Mono'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    background: #04060A;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    color: #F2F5FA;
    position: relative;
  }

  /* 底层：极淡的双色径向光 + 细网格 */
  .bg-glow {
    position:absolute; inset:0;
    background:
      radial-gradient(1100px 620px at 18% -8%, rgba(212,175,55,.075), transparent 62%),
      radial-gradient(900px 560px at 92% 104%, rgba(78,205,196,.065), transparent 60%),
      linear-gradient(168deg, #05080E 0%, #070B12 48%, #04060A 100%);
  }
  .bg-grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at 50% 42%, #000 32%, transparent 82%);
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 32%, transparent 82%);
  }
  .vignette {
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 46%, transparent 52%, rgba(0,0,0,.55) 100%);
  }

  .stage { position:absolute; inset:0; padding: 62px 84px 54px; display:flex; flex-direction:column; }

  /* ---------- 页眉 ---------- */
  header { display:flex; align-items:flex-end; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:13px; margin-bottom:20px; }
  .mark {
    width:9px; height:26px; border-radius:2px;
    background: linear-gradient(180deg, #F4D77A, #D4AF37 55%, rgba(212,175,55,.25));
    box-shadow: 0 0 16px rgba(212,175,55,.55);
  }
  .brand-name {
    font-size:12px; letter-spacing:.36em; text-transform:uppercase;
    color: rgba(242,245,250,.5); font-weight:600;
  }
  h1 { font-size:52px; font-weight:700; letter-spacing:-.025em; line-height:1.08; }
  h1 .thin { font-weight:300; color: rgba(242,245,250,.62); }
  h1 .x { font-weight:200; color: rgba(212,175,55,.85); margin:0 12px; font-size:40px; vertical-align:6px; }
  .sub {
    margin-top:14px; font-size:14.5px; letter-spacing:.055em;
    color: rgba(242,245,250,.4); font-weight:300;
  }

  /* 右上角指标胶囊 */
  .kpis { display:flex; gap:11px; padding-bottom:6px; }
  .kpi {
    border:1px solid rgba(255,255,255,.075);
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
    border-radius:11px; padding:11px 17px 10px; min-width:132px;
    backdrop-filter: blur(14px);
  }
  .kpi .k { font-size:10px; letter-spacing:.2em; color:rgba(242,245,250,.36); text-transform:uppercase; }
  .kpi .v {
    margin-top:5px; font-family:'Mono', monospace; font-size:21px;
    font-weight:600; letter-spacing:-.02em; font-variant-numeric: tabular-nums;
  }
  .kpi .v.gold { color:#F0CE72; }
  .kpi .v.cool { color:#78E3D8; }
  .kpi .u { font-size:11px; color:rgba(242,245,250,.32); margin-left:3px; font-family:inherit; }

  /* ---------- 主图 ---------- */
  .panel {
    position:relative; flex:1; margin-top:34px;
    border:1px solid rgba(255,255,255,.065);
    border-radius:18px;
    background: linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,.006));
    box-shadow: 0 30px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(18px);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .panel::after {
    content:''; position:absolute; left:0; right:0; top:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,.5), rgba(78,205,196,.45), transparent);
    opacity:.85; z-index:5;
  }
  .chart-wrap { position:relative; flex:1; min-height:0; }
  svg { display:block; width:100%; height:100%; }

  /* 图例 */
  .legend {
    position:absolute; left:26px; top:20px; display:flex; gap:20px;
    font-size:12px; letter-spacing:.04em; color:rgba(242,245,250,.5);
  }
  .lg { display:flex; align-items:center; gap:7px; }
  .lg i { width:16px; height:3px; border-radius:2px; display:block; }
  .lg i.dot { width:8px; height:8px; border-radius:2px; }

  /* 右上角状态 */
  .status {
    position:absolute; right:26px; top:20px; display:flex; align-items:center; gap:8px;
    font-size:11.5px; letter-spacing:.14em; color:rgba(242,245,250,.34);
    text-transform:uppercase;
  }
  .status .bullet {
    width:6px; height:6px; border-radius:50%; background:#3DDC97;
    box-shadow:0 0 10px rgba(61,220,151,.9);
  }

  /* 底部收益条 */
  .footer {
    position:relative; flex:0 0 62px;
    margin:0 26px; display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.055);
  }
  .foot-l { font-size:11.5px; letter-spacing:.16em; color:rgba(242,245,250,.3); text-transform:uppercase; }
  .foot-r { display:flex; align-items:baseline; gap:12px; }
  .foot-r .lbl { font-size:12px; color:rgba(242,245,250,.36); letter-spacing:.1em; }
  .foot-r .num {
    font-family:'Mono', monospace; font-size:32px; font-weight:600;
    letter-spacing:-.03em; color:#F0CE72;
    text-shadow: 0 0 26px rgba(212,175,55,.42);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>
  <div class="vignette"></div>

  <div class="stage">
    <header>
      <div>
        <div class="brand"><span class="mark"></span><span class="brand-name">LoomGrid</span></div>
        <h1>负荷曲线<span class="x">×</span>分时电价<span class="x">×</span><span class="thin">储能充放</span></h1>
        <div class="sub">工商业储能测算工作台 &nbsp;·&nbsp; 谷时充、峰时放 &nbsp;·&nbsp; 一天一循环</div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="k">谷充</div><div class="v cool"><span id="k_chg">0</span><span class="u">kWh</span></div></div>
        <div class="kpi"><div class="k">峰放</div><div class="v cool"><span id="k_dis">0</span><span class="u">kWh</span></div></div>
        <div class="kpi"><div class="k">峰谷价差</div><div class="v gold">0.90<span class="u">元</span></div></div>
      </div>
    </header>

    <div class="panel">
      <div class="chart-wrap">
        <div class="legend">
          <div class="lg"><i style="background:linear-gradient(90deg,#E8F4FF,#7FD8FF)"></i>负荷</div>
          <div class="lg"><i class="dot" style="background:linear-gradient(180deg,#FF8E8E,#FF6B6B)"></i>放电</div>
          <div class="lg"><i class="dot" style="background:linear-gradient(180deg,#6EE7B7,#3DDC97)"></i>充电</div>
          <div class="lg"><i style="background:linear-gradient(90deg,#F4D77A,#D4AF37)"></i>SOC</div>
        </div>
        <div class="status"><span class="bullet"></span>运行中</div>
        <svg id="chart" viewBox="0 0 1752 700" preserveAspectRatio="none"></svg>
      </div>
      <div class="footer">
        <div class="foot-l">Daily Arbitrage · 一天一循环</div>
        <div class="foot-r">
          <span class="lbl">日套利</span>
          <span class="num">¥<span id="money">0</span></span>
        </div>
      </div>
    </div>
  </div>

<script src="demo_data.js"></script>
<script>
// 数据来自 algorithms.dispatch.optimal_dispatch_lp（真实 LP 最优调度）
// 不再手算：README 写着「由 algorithms/ 真实算法驱动」，那就得真的用算法。
const A = window.ALGO;
if (!A) throw new Error('demo_data.js 未加载，先跑 algo_drive.py');

const N = A.hours.length, DT = 0.25, CAP = A.cap;
const HRS = A.hours;
const LOAD = A.load;
const CHG = A.p_ch.map(v => -v);   // 动画里充电画在 0 线以下
const DIS = A.p_dis;
const SOC = A.soc;
const CHG_KWH = A.chg_kwh;
const DIS_KWH = A.dis_kwh;
const TOTAL_MONEY = A.revenue;

// 累计收益（按分时电价逐点累加，与 LP 目标值一致）
const CUM = [];
let c = 0;
for (let i = 0; i < N; i++) {
  const p = A.price[i];
  c += (DIS[i] - A.p_ch[i] * 0) * DT * p - A.p_ch[i] * DT * p;
  CUM.push(c);
}
// 归一化到算法给出的总收益，避免逐点累加的累计误差
const scale = TOTAL_MONEY / (CUM[N - 1] || 1);
for (let i = 0; i < N; i++) CUM[i] *= scale;

// ---- 画布几何 ----
const VW = 1752, VH = 700;
const L = 96, R = VW - 62;        // 横向绘图区
const TOP = 76, MID = 404;        // 上半区（功率）
const ST = 482, SB = 628;         // 下半区（SOC）
const PW = R - L;
const PMIN = -260, PMAX = 900;    // 功率取值范围（含充电负值）

const xOf = i => L + (i / (N - 1)) * PW;
// 关键：0-900 → TOP-MID 会把 -220 推到 SOC 区，必须映射完整范围
const yPower = v => MID - ((v - PMIN) / (PMAX - PMIN)) * (MID - TOP);
const ySoc = v => SB - (v / 100) * (SB - ST);

// 电价分区
const ZONES = [
  [0, 7, '谷'], [7, 10, '平'], [10, 12, '峰'], [12, 14, '平'],
  [14, 16, '尖'], [16, 18, '平'], [18, 22, '峰'], [22, 24, '谷']
];
const ZONE_STYLE = {
  '谷': ['rgba(61,220,151,.055)', 'rgba(61,220,151,.5)'],
  '平': ['rgba(255,255,255,.018)', 'rgba(255,255,255,.2)'],
  '峰': ['rgba(255,120,120,.06)', 'rgba(255,120,120,.5)'],
  '尖': ['rgba(255,80,80,.085)', 'rgba(255,80,80,.72)'],
};

function build(t) {
  const n = Math.max(2, Math.round(t * N));
  const E = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('chart');
  svg.innerHTML = '';

  const mk = (tag, attrs) => {
    const el = document.createElementNS(E, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };

  // defs：渐变与滤镜
  const defs = mk('defs', {});
  defs.innerHTML = `
    <linearGradient id="gLoad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAF4FF"/><stop offset="62%" stop-color="#BFE4FF"/>
      <stop offset="100%" stop-color="#7FD8FF"/>
    </linearGradient>
    <linearGradient id="gLoadFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(127,216,255,.22)"/>
      <stop offset="100%" stop-color="rgba(127,216,255,0)"/>
    </linearGradient>
    <linearGradient id="gChg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#2FB57C" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="gDis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8E8E" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#E04F4F" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="gSoc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F4D77A"/>
    </linearGradient>
    <linearGradient id="gSocFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(212,175,55,.28)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-80%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>`;
  svg.appendChild(defs);

  // 电价分区底色
  ZONES.forEach(([a, b, name]) => {
    const x1 = L + (a / 24) * PW, x2 = L + (b / 24) * PW;
    svg.appendChild(mk('rect', {
      x: x1, y: TOP, width: x2 - x1, height: SB - TOP,
      fill: ZONE_STYLE[name][0]
    }));
    svg.appendChild(mk('rect', {
      x: x1, y: TOP, width: x2 - x1, height: 1.6,
      fill: ZONE_STYLE[name][1], opacity: .6
    }));
    const lbl = mk('text', {
      x: (x1 + x2) / 2, y: TOP - 22, 'text-anchor': 'middle',
      fill: 'rgba(242,245,250,.42)', 'font-size': 14,
      'letter-spacing': '3.2', 'font-weight': 500
    });
    lbl.textContent = name;
    svg.appendChild(lbl);
  });

  // 网格
  for (let v = -200; v <= 800; v += 200) {
    svg.appendChild(mk('line', {
      x1: L, y1: yPower(v), x2: R, y2: yPower(v),
      stroke: v === 0 ? 'rgba(255,255,255,.13)' : 'rgba(255,255,255,.045)',
      'stroke-width': 1
    }));
    const tx = mk('text', {
      x: L - 16, y: yPower(v) + 4, 'text-anchor': 'end',
      fill: v === 0 ? 'rgba(242,245,250,.42)' : 'rgba(242,245,250,.24)',
      'font-size': 11.5, 'font-family': 'Mono, monospace'
    });
    tx.textContent = v;
    svg.appendChild(tx);
  }

  // 竖向刻度
  for (let h = 0; h <= 24; h += 3) {
    const x = L + (h / 24) * PW;
    svg.appendChild(mk('line', {
      x1: x, y1: TOP, x2: x, y2: SB,
      stroke: 'rgba(255,255,255,.038)', 'stroke-width': 1
    }));
    const tx = mk('text', {
      x: x, y: SB + 24, 'text-anchor': 'middle',
      fill: 'rgba(242,245,250,.24)', 'font-size': 11.5,
      'font-family': 'Mono, monospace'
    });
    tx.textContent = `${String(h).padStart(2, '0')}:00`;
    svg.appendChild(tx);
  }

  // 充放电柱（圆角胶囊）
  // 注意：充电是负值，yPower(CHG) 比 yPower(0) 大，高必须取正数，
  // 否则 height 为负、SVG 直接不渲染（曾因此整排充电柱消失）
  const bw = Math.max(3, PW / N * 0.52);
  const y0 = yPower(0);
  for (let i = 0; i < n; i++) {
    if (CHG[i] < 0) {
      const yb = yPower(CHG[i]);
      svg.appendChild(mk('rect', {
        x: xOf(i) - bw / 2, y: y0, width: bw, height: Math.max(1, yb - y0),
        rx: bw / 2.4, fill: 'url(#gChg)', filter: 'url(#softGlow)'
      }));
    }
    if (DIS[i] > 0) {
      const yt = yPower(DIS[i]);
      svg.appendChild(mk('rect', {
        x: xOf(i) - bw / 2, y: yt, width: bw, height: Math.max(1, y0 - yt),
        rx: bw / 2.4, fill: 'url(#gDis)', filter: 'url(#softGlow)'
      }));
    }
  }

  // 负荷面积 + 曲线
  let area = `M ${xOf(0)} ${yPower(0)} `;
  for (let i = 0; i < n; i++) area += `L ${xOf(i)} ${yPower(LOAD[i])} `;
  area += `L ${xOf(n - 1)} ${yPower(0)} Z`;
  svg.appendChild(mk('path', { d: area, fill: 'url(#gLoadFill)' }));

  let line = '';
  for (let i = 0; i < n; i++) line += (i ? 'L ' : 'M ') + xOf(i) + ' ' + yPower(LOAD[i]) + ' ';
  svg.appendChild(mk('path', {
    d: line, fill: 'none', stroke: 'url(#gLoad)',
    'stroke-width': 2.2, 'stroke-linecap': 'round',
    'stroke-linejoin': 'round', filter: 'url(#glow)'
  }));

  // 当前点光斑
  const cx = xOf(n - 1), cy = yPower(LOAD[n - 1]);
  svg.appendChild(mk('circle', {
    cx, cy, r: 9, fill: 'rgba(191,228,255,.22)', filter: 'url(#glow)'
  }));
  svg.appendChild(mk('circle', { cx, cy, r: 3.4, fill: '#EAF4FF' }));

  // SOC 面积 + 曲线
  let sarea = `M ${xOf(0)} ${ySoc(0)} `;
  for (let i = 0; i < n; i++) sarea += `L ${xOf(i)} ${ySoc(SOC[i])} `;
  sarea += `L ${xOf(n - 1)} ${ySoc(0)} Z`;
  svg.appendChild(mk('path', { d: sarea, fill: 'url(#gSocFill)' }));

  let sline = '';
  for (let i = 0; i < n; i++) sline += (i ? 'L ' : 'M ') + xOf(i) + ' ' + ySoc(SOC[i]) + ' ';
  svg.appendChild(mk('path', {
    d: sline, fill: 'none', stroke: 'url(#gSoc)',
    'stroke-width': 2.2, 'stroke-linecap': 'round', filter: 'url(#glow)'
  }));

  // SOC 上下限虚线
  [95, 5].forEach(v => {
    svg.appendChild(mk('line', {
      x1: L, y1: ySoc(v), x2: R, y2: ySoc(v),
      stroke: 'rgba(212,175,55,.3)', 'stroke-width': 1,
      'stroke-dasharray': '6 6'
    }));
    const tx = mk('text', {
      x: R + 8, y: ySoc(v) + 4, fill: 'rgba(212,175,55,.55)',
      'font-size': 11, 'font-family': 'Mono, monospace'
    });
    tx.textContent = `${v}%`;
    svg.appendChild(tx);
  });

  // 轴标题
  const t1 = mk('text', {
    x: 20, y: (TOP + MID) / 2, fill: 'rgba(242,245,250,.3)',
    'font-size': 12, 'letter-spacing': '2',
    'text-anchor': 'middle',
    transform: `rotate(-90 20 ${(TOP + MID) / 2})`
  });
  t1.textContent = '功率 kW';
  svg.appendChild(t1);

  const t2 = mk('text', {
    x: 20, y: (ST + SB) / 2, fill: 'rgba(242,245,250,.3)',
    'font-size': 12, 'letter-spacing': '2',
    'text-anchor': 'middle',
    transform: `rotate(-90 20 ${(ST + SB) / 2})`
  });
  t2.textContent = 'SOC %';
  svg.appendChild(t2);

  // 数值联动
  document.getElementById('k_chg').textContent = Math.round(CHG_KWH * t).toLocaleString();
  document.getElementById('k_dis').textContent = Math.round(DIS_KWH * t).toLocaleString();
  document.getElementById('money').textContent = Math.round(CUM[n - 1]).toLocaleString();
}

window.renderFrame = t => build(t);
build(0);
</script>
</body>
</html>
