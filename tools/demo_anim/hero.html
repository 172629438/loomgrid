<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LoomGrid hero</title>
<style>
  @font-face { font-family: 'Mono'; src: local('JetBrains Mono'), local('Consolas'), local('Cascadia Mono'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:2560px; height:1440px; overflow:hidden; }
  body {
    background:#070B12;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    color:#F2F5FA; position:relative;
  }
  .glow {
    position:absolute; inset:0;
    background:
      radial-gradient(1500px 860px at 14% -10%, rgba(212,175,55,.13), transparent 62%),
      radial-gradient(1300px 800px at 94% 108%, rgba(78,205,196,.11), transparent 60%),
      linear-gradient(165deg,#080D15 0%,#0A0F18 46%,#070B12 100%);
  }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:88px 88px;
    mask-image: radial-gradient(circle at 50% 40%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 30%, transparent 80%);
  }
  .vig { position:absolute; inset:0;
    background: radial-gradient(circle at 50% 44%, transparent 50%, rgba(0,0,0,.6) 100%); }

  .stage { position:absolute; inset:0; padding:86px 118px 74px; display:flex; flex-direction:column; }

  /* 顶部 */
  header { display:flex; align-items:flex-start; justify-content:space-between; }
  .mark { width:12px; height:38px; border-radius:3px;
    background:linear-gradient(180deg,#F4D77A,#D4AF37 55%,rgba(212,175,55,.2));
    box-shadow:0 0 24px rgba(212,175,55,.6); }
  .brand { display:flex; align-items:center; gap:18px; }
  .bname { font-size:74px; font-weight:700; letter-spacing:-.035em; line-height:1; }
  .bname span { font-weight:200; color:rgba(242,245,250,.5); }
  .kick { margin-top:22px; font-size:23px; letter-spacing:.15em;
    color:rgba(242,245,250,.42); font-weight:300; }
  .kick em { font-style:normal; color:rgba(212,175,55,.9); }

  .kpis { display:flex; gap:0; padding-top:22px; }
  .kpi { text-align:right; padding-left:44px; margin-left:44px;
    border-left:1px solid rgba(255,255,255,.09); }
  .kpi:first-child { padding-left:0; margin-left:0; border-left:none; }
  .kpi .k { font-size:17px; letter-spacing:.2em; color:rgba(242,245,250,.34); }
  .kpi .v { margin-top:9px; font-family:'Mono',monospace; font-size:40px;
    font-weight:600; letter-spacing:-.03em; }
  .kpi .v.gold { color:#F0CE72; text-shadow:0 0 34px rgba(212,175,55,.5); }
  .kpi .v.cool { color:#7FD8FF; }
  .kpi .u { font-size:19px; color:rgba(242,245,250,.3); margin-left:5px; font-family:inherit; }

  /* 图 */
  .chart { position:relative; flex:1; margin-top:62px; }
  svg { display:block; width:100%; height:100%; }

  /* 底部 */
  footer { display:flex; align-items:center; justify-content:space-between;
    margin-top:30px; padding-top:26px;
    border-top:1px solid rgba(255,255,255,.07); }
  .fleft { display:flex; gap:52px; font-size:19px; color:rgba(242,245,250,.32);
    letter-spacing:.06em; }
  .fleft b { color:rgba(242,245,250,.72); font-weight:500; }
  .fright { font-size:19px; letter-spacing:.14em; color:rgba(242,245,250,.28); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="vig"></div>

  <div class="stage">
    <header>
      <div>
        <div class="brand"><span class="mark"></span>
          <div class="bname">Loom<span>Grid</span></div></div>
        <div class="kick">工商业储能测算工作台 &nbsp;·&nbsp; 负荷曲线 <em>→</em> 充放空间 <em>→</em> 调度 <em>→</em> 经济性</div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="k">峰谷价差</div><div class="v gold">0.88<span class="u">元/kWh</span></div></div>
        <div class="kpi"><div class="k">日循环上限</div><div class="v cool">726<span class="u">kWh</span></div></div>
        <div class="kpi"><div class="k">最优容量</div><div class="v cool">800<span class="u">kWh</span></div></div>
      </div>
    </header>

    <div class="chart">
      <svg id="s" viewBox="0 0 2324 900" preserveAspectRatio="none"></svg>
    </div>

    <footer>
      <div class="fleft">
        <div><b>32</b> 个省级行政区分时电价</div>
        <div><b>96</b> 个类 · <b>3.6</b> 万行</div>
        <div><b>433</b> 项断言</div>
      </div>
      <div class="fright">SIZING · DISPATCH · ECONOMICS</div>
    </footer>
  </div>

<script>
const E='http://www.w3.org/2000/svg';
const svg=document.getElementById('s');
const VW=2324, VH=900;
const L=118, R=VW-28, TOP=44, MID=560, ST=684, SB=846;
const PW=R-L;
const PMIN=-360, PMAX=2000;

const mk=(t,a)=>{const e=document.createElementNS(E,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const xOf=h=>L+(h/24)*PW;
const yP=v=>MID-((v-PMIN)/(PMAX-PMIN))*(MID-TOP);
const yS=v=>SB-(v/100)*(SB-ST);

const defs=mk('defs',{});
defs.innerHTML=`
  <linearGradient id="gLoad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#EAF4FF"/><stop offset="55%" stop-color="#BFE4FF"/>
    <stop offset="100%" stop-color="#7FD8FF"/></linearGradient>
  <linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(127,216,255,.24)"/>
    <stop offset="100%" stop-color="rgba(127,216,255,0)"/></linearGradient>
  <linearGradient id="gChg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6EE7B7" stop-opacity=".92"/>
    <stop offset="100%" stop-color="#2FB57C" stop-opacity=".45"/></linearGradient>
  <linearGradient id="gDis" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF8E8E" stop-opacity=".92"/>
    <stop offset="100%" stop-color="#E04F4F" stop-opacity=".45"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F4D77A"/></linearGradient>
  <filter id="glow" x="-30%" y="-70%" width="160%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="src"/></feMerge></filter>
  <filter id="glow2" x="-40%" y="-90%" width="180%" height="340%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="src"/></feMerge></filter>`;
svg.appendChild(defs);

// 电价分区
const ZONES=[[0,8,'谷','rgba(61,220,151,.05)'],[8,11,'峰','rgba(255,120,120,.055)'],
  [11,13,'平','rgba(255,255,255,.014)'],[13,17,'峰','rgba(255,120,120,.055)'],
  [17,22,'平','rgba(255,255,255,.014)'],[22,24,'谷','rgba(61,220,151,.05)']];
ZONES.forEach(([a,b,n,f])=>{
  svg.appendChild(mk('rect',{x:xOf(a),y:TOP,width:xOf(b)-xOf(a),height:SB-TOP,fill:f}));
  const t=mk('text',{x:(xOf(a)+xOf(b))/2,y:TOP-16,'text-anchor':'middle',
    fill:'rgba(242,245,250,.30)','font-size':21,'letter-spacing':'6'});
  t.textContent=n; svg.appendChild(t);
});

// 网格
for(let v=0;v<=2000;v+=500){
  svg.appendChild(mk('line',{x1:L,y1:yP(v),x2:R,y2:yP(v),
    stroke:v===0?'rgba(255,255,255,.14)':'rgba(255,255,255,.045)','stroke-width':1.2}));
  const t=mk('text',{x:L-22,y:yP(v)+7,'text-anchor':'end',
    fill:'rgba(242,245,250,.26)','font-size':19,'font-family':'Mono, monospace'});
  t.textContent=v; svg.appendChild(t);
}
for(let h=0;h<=24;h+=2){
  svg.appendChild(mk('line',{x1:xOf(h),y1:TOP,x2:xOf(h),y2:SB,
    stroke:'rgba(255,255,255,.035)','stroke-width':1}));
  const t=mk('text',{x:xOf(h),y:SB+30,'text-anchor':'middle',
    fill:'rgba(242,245,250,.24)','font-size':19,'font-family':'Mono, monospace'});
  t.textContent=String(h).padStart(2,'0')+':00'; svg.appendChild(t);
}

// 负荷曲线：上午爬升、午间凹陷、傍晚尖峰
const LOAD=[
 [0,42],[1,38],[2,35],[3,34],[4,38],[5,52],[6,86],[7,168],[8,320],[9,520],
 [10,760],[11,1042],[12,466],[13,690],[14,880],[15,1180],[16,1724],[17,486],
 [18,462],[19,388],[20,300],[21,224],[22,168],[23,128],[24,96]];
let line='', area='M '+xOf(0)+' '+yP(0)+' ';
LOAD.forEach(([h,v],i)=>{
  line+=(i?'L ':'M ')+xOf(h)+' '+yP(v)+' ';
  area+='L '+xOf(h)+' '+yP(v)+' ';
});
area+='L '+xOf(24)+' '+yP(0)+' Z';
svg.appendChild(mk('path',{d:area,fill:'url(#gFill)'}));
svg.appendChild(mk('path',{d:line,fill:'none',stroke:'url(#gLoad)',
  'stroke-width':3.4,'stroke-linejoin':'round','stroke-linecap':'round',filter:'url(#glow)'}));

// 充放柱
function bars(from,to,val,grad,below){
  for(let h=from;h<to;h+=0.34){
    const y0=yP(0), y1=yP(below?val:val);
    const top=Math.min(y0,y1), hgt=Math.abs(y1-y0);
    svg.appendChild(mk('rect',{x:xOf(h)-5,y:top,width:10,height:hgt,rx:5,
      fill:grad,filter:'url(#glow2)'}));
  }
}
// 充放柱：在 2000 kW 量程下，-120/200 几乎看不见，按真实调度量放大
bars(0,7.8,-180,'url(#gChg)',false);
bars(12.2,13.8,-180,'url(#gChg)',false);
bars(13.8,17.0,520,'url(#gDis)',false);
bars(17.0,22.0,380,'url(#gDis)',false);

// 峰值标注
const px=xOf(16), py=yP(1724);
svg.appendChild(mk('circle',{cx:px,cy:py,r:15,fill:'rgba(244,215,122,.20)',filter:'url(#glow)'}));
svg.appendChild(mk('circle',{cx:px,cy:py,r:6,fill:'#F4D77A'}));
svg.appendChild(mk('line',{x1:px,y1:py-22,x2:px,y2:TOP,stroke:'rgba(212,175,55,.35)',
  'stroke-width':1.4,'stroke-dasharray':'7 7'}));
const pl=mk('text',{x:px+26,y:py-24,fill:'#F0CE72','font-size':27,'font-weight':600,
  'letter-spacing':'1'});
pl.textContent='峰值 1724 kW'; svg.appendChild(pl);

// 轴名
const y1=mk('text',{x:L-96,y:(TOP+MID)/2,fill:'rgba(242,245,250,.3)','font-size':21,
  'letter-spacing':'4','text-anchor':'middle',transform:`rotate(-90 ${L-96} ${(TOP+MID)/2})`});
y1.textContent='负荷 kW'; svg.appendChild(y1);
const y2=mk('text',{x:L-96,y:(ST+SB)/2,fill:'rgba(242,245,250,.3)','font-size':21,
  'letter-spacing':'4','text-anchor':'middle',transform:`rotate(-90 ${L-96} ${(ST+SB)/2})`});
y2.textContent='充放 kW'; svg.appendChild(y2);

// 图例
const lg=[['负荷','url(#gLoad)',0],['充电','url(#gChg)',0],['放电','url(#gDis)',0]];
lg.forEach(([name,grad],i)=>{
  const gx=R-460+i*150;
  svg.appendChild(mk('rect',{x:gx,y:TOP-30,width:26,height:7,rx:3.5,fill:grad}));
  const t=mk('text',{x:gx+36,y:TOP-20,fill:'rgba(242,245,250,.42)','font-size':20});
  t.textContent=name; svg.appendChild(t);
});
</script>
</body>
</html>
