name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "assets/**"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  algorithms:
    name: algorithms (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy loguru ortools

      # 只有三个脚本不依赖 PySide6。判据是实测，不是看名字：
      #   invariants / algorithms_math  直接 import algorithms/ 下的模块
      #   alg_parity                   只对源码做 ast.parse，不 import 主程序
      # 其余脚本都用 importlib.exec_module 加载主程序，而主程序顶层就 import Qt。
      - name: Verify invariants
        run: python tests/verify_invariants.py

      - name: Verify math
        run: python tests/verify_algorithms_math.py

      - name: Verify parity
        run: python tests/verify_alg_parity.py

  package:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Check wheel contents
        run: python .github/workflows/check_wheel.py

      - name: Import smoke test
        run: |
          # 核心依赖不装的话，import 子模块会炸——这是个真实场景：
          # 有人只装 wheel 不装依赖，包本身应该还能 import。
          # 先测懒加载（不装依赖），再测子模块（装依赖）。
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -c "import loomgrid_algos; print('lazy import OK, version', loomgrid_algos.__version__)"
          python -m pip install --quiet numpy pandas loguru
          python -c "from loomgrid_algos import periods, spaces, dispatch, milp, finance, loadgen, diagnostics; print('all 7 submodules importable from an unrelated cwd')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 14
