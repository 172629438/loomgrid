<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>这一页不存在 · LoomGrid</title>
<meta name="theme-color" content="#08090B">
<style>
  html,body{margin:0;height:100%;background:#08090B;color:#EDECE8;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased}
  .box{height:100%;display:grid;align-content:center;
    padding:0 clamp(24px,7vw,120px);max-width:760px}
  .code{font-family:ui-monospace,Consolas,monospace;font-size:11px;
    letter-spacing:.12em;color:rgba(237,236,232,.34)}
  h1{font-size:clamp(28px,4.4vw,46px);font-weight:500;letter-spacing:-.022em;
    line-height:1.2;margin:18px 0 0}
  p{font-size:15px;line-height:1.85;color:rgba(237,236,232,.58);
    font-weight:300;max-width:52ch;margin:26px 0 0}
  a{display:inline-block;margin-top:40px;color:#EDECE8;text-decoration:none;
    font-size:14px;padding-bottom:5px;border-bottom:1px solid rgba(237,236,232,.3);
    transition:border-color .18s ease,color .18s ease}
  a:hover{color:#C9A227;border-bottom-color:#C9A227}
  .bar{position:fixed;left:0;top:0;height:1px;width:100%;
    background:rgba(237,236,232,.16)}
</style>
</head>
<body>
<div class="bar"></div>
<div class="box">
  <div class="code">404</div>
  <h1>这一页不在织机上</h1>
  <p>你访问的地址没有对应的页面。可能是链接写错了，也可能是这个项目改过结构之后，旧的路径失效了。</p>
  <a href="/loomgrid/">回 LoomGrid 首页</a>
</div>
</body>
</html>
